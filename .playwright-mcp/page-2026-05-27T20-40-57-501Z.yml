        - heading [level=2] [ref=e136]
        - paragraph [ref=e147]: La Direction Générale des Ivoiriens de l'Extérieur (DGIE) a pour mission de renforcer les liens entre la Côte d'Ivoire et sa diaspora. Avec plus de 1,2 million d'Ivoiriens répartis dans le monde, nous avons un potentiel immense à mobiliser pour le développement de notre nation.
        - paragraph [ref=e148]: Le projet AYENAH représente une avancée majeure dans notre stratégie de mobilisation de la diaspora. Il offre un cadre structuré et sécurisé pour transformer l'engagement de nos compatriotes de l'extérieur en actions concrètes sur le terrain.
      - blockquote [ref=e150]:
        - generic [ref=e151]:
          - generic [ref=e152]: AYENAH
          - text: incarne notre vision d'une diaspora pleinement intégrée dans le processus de développement national. Ensemble, construisons l'avenir de la Côte d'Ivoire.

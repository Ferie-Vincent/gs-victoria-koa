name: CI / CD — GS Victoria-Koa

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── TESTS ────────────────────────────────────────────────────────────────
  test:
    name: Tests PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Composer install
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup .env test
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          echo "DB_DATABASE=:memory:" >> .env
          php artisan key:generate

      - name: Migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --stop-on-failure

  # ─── DEPLOY (main uniquement, après tests OK) ─────────────────────────────
  deploy:
    name: Deploy → Hostinger
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install
        run: npm ci

      - name: Build assets Vite
        run: npm run build

      - name: Sync assets compilés → serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "public/build/"
          target: "${{ secrets.DEPLOY_PATH }}/public/build/"
          strip_components: 2

      - name: Deploy sur serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            /opt/alt/php83/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            /opt/alt/php83/usr/bin/php artisan config:cache
            /opt/alt/php83/usr/bin/php artisan route:cache
            /opt/alt/php83/usr/bin/php artisan view:cache
            /opt/alt/php83/usr/bin/php artisan migrate --force
            chmod -R 775 storage bootstrap/cache
            echo "✓ Deploy terminé"
